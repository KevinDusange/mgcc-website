<!-- A fully fleshed-out <head>, dynamically changing based on client.json and the page front matter -->

<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Standard meta tags -->
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="{{ description }}">
        <link rel="canonical" href="{{ client.domain }}{{ page.url }}">
        <meta name="generator" content="{{ eleventy.generator }}">

        <!--Social Media Display-->
        {% set socialImage = image or "/assets/images/mgcc/global-port-hero.jpg" %}
        <meta property="og:title" content="{{ metaTitle or title }}"/>
        <meta property="og:description" content="{{ description }}"/>
        <meta property="og:type" content="website"/>
        <meta property="og:url" content="{{ client.domain }}{{ page.url }}"/>
        <meta property="og:image" content="{{ client.domain }}{{ socialImage }}"/>
        <meta property="og:image:secure_url" content="{{ client.domain }}{{ socialImage }}"/>

        <!--MGCC browser and saved-site icons-->
        <link rel="icon" type="image/png" href="/assets/favicons/favicon-32x32.png" sizes="32x32"/>
        <link rel="icon" type="image/png" href="/assets/favicons/favicon-96x96.png" sizes="96x96"/>
        <link rel="apple-touch-icon" href="/assets/favicons/apple-touch-icon.png" sizes="180x180"/>
        <meta name="apple-mobile-web-app-title" content="MGCC"/>
        <link rel="manifest" href="/assets/favicons/site.webmanifest"/>

        <!-- Preloads -->
        <link rel="preload" as="image" type="image/webp" href="/assets/svgs/mgcc-logo-header.webp">
        <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/inter-v20-latin-variable.woff2" crossorigin>
        <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/source-serif-4-v14-latin-variable.woff2" crossorigin>

        <!-- Sitewide Stylesheets and Scripts -->
        <link rel="stylesheet" href="/assets/css/root.css">
        <script defer src="/assets/js/dark.js"></script>
        <script defer src="/assets/js/nav.js"></script>

        {% block head %}{% endblock %}

        <title>{{ metaTitle or title }}</title>
    </head>
    <body>
        <!--Screen reader skip main nav-->
        <a class="skip" aria-label="skip to main content" href="#main">Click To Skip To Main Content</a>

        {% include "sections/header.html" %}
        <main id="main">
            {% block body %}{% endblock %}
        </main>
        {% include "sections/footer.html" %}

    </body>
</html>
